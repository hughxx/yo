<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoreInsight Local Toolkit 已启动</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px;display:grid;place-items:center;background:linear-gradient(145deg,#e8efff,#fafbfe 55%,#e9edf7);color:#18233b;font-family:"Segoe UI Variable",Inter,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(1080px,94vw);padding:38px;border:1px solid rgba(78,101,156,.13);border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 30px 90px rgba(34,51,91,.17)}header{display:flex;align-items:center;gap:19px}header img{width:64px;height:64px}h1{margin:0 0 7px;font-size:30px;letter-spacing:-.5px}header p{margin:0;color:#68758e;font-size:16px}.ready{margin-left:auto;padding:9px 14px;border-radius:20px;background:#e8f8f0;color:#248157;font-size:13px}.content{margin-top:32px;display:grid;grid-template-columns:minmax(620px,1.7fr) minmax(230px,.7fr);gap:34px}.desktop{position:relative;min-height:390px;overflow:hidden;border:1px solid #cfd8ea;border-radius:20px;background:radial-gradient(circle at 56% 40%,#a4c5ff 0 8%,transparent 27%),linear-gradient(135deg,#0f4eb1,#70a6ed 48%,#244c9f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 14px 32px rgba(36,67,127,.16)}.desktop:before,.desktop:after{content:"";position:absolute;border-radius:48% 52% 58% 42%;filter:blur(2px);transform:rotate(-24deg)}.desktop:before{width:460px;height:210px;left:80px;top:20px;background:linear-gradient(145deg,rgba(218,235,255,.9),rgba(90,145,229,.2));box-shadow:0 0 45px rgba(224,239,255,.45)}.desktop:after{width:400px;height:180px;left:135px;top:145px;background:linear-gradient(145deg,rgba(40,92,185,.28),rgba(199,222,255,.78));box-shadow:0 0 38px rgba(205,226,255,.35)}.desktop-icons{position:absolute;z-index:2;top:19px;left:16px;display:grid;gap:17px}.desktop-icon{width:62px;display:grid;justify-items:center;gap:4px;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.65)}.desktop-icon i{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.13);font-size:23px;font-style:normal}.float-logo{position:absolute;z-index:4;right:28px;top:92px;width:70px;height:70px;padding:4px;border-radius:50%;filter:drop-shadow(0 10px 16px rgba(16,41,96,.35))}.menu{position:absolute;z-index:5;right:93px;top:52px;width:184px;padding:7px;border:1px solid rgba(138,154,184,.4);border-radius:11px;background:rgba(250,252,255,.97);box-shadow:0 18px 45px rgba(18,34,67,.28);font-size:12px;backdrop-filter:blur(18px)}.menu div{padding:8px 10px;display:flex;align-items:center;gap:9px;border-radius:6px}.menu div:hover,.menu .selected{background:#e8f0ff;color:#245ac9}.menu div span{width:18px;color:#5071aa;text-align:center}.menu hr{margin:5px 7px;border:0;border-top:1px solid #e1e6ee}.taskbar{position:absolute;z-index:8;left:0;right:0;bottom:0;height:52px;border-top:1px solid rgba(255,255,255,.55);background:rgba(241,246,254,.88);box-shadow:0 -5px 18px rgba(25,47,88,.13);backdrop-filter:blur(22px)}.taskbar-center{position:absolute;left:50%;top:7px;transform:translateX(-50%);display:flex;align-items:center;gap:7px}.task-app{width:38px;height:38px;display:grid;place-items:center;border-radius:6px;color:#365274;font-size:18px}.task-app.active{background:rgba(255,255,255,.74);box-shadow:0 2px 7px rgba(37,61,98,.12)}.win-logo{display:grid;grid-template-columns:7px 7px;grid-template-rows:7px 7px;gap:2px}.win-logo i{background:#1670d2}.task-search{width:94px!important;display:flex!important;justify-content:flex-start!important;gap:6px!important;border:1px solid rgba(143,160,190,.3);background:rgba(255,255,255,.72);font-size:11px!important}.task-search b{font-size:17px;font-weight:400}.task-outlook{color:#fff;background:#1473e6;font-size:15px;font-weight:700}.task-core img{width:28px;height:28px}.tray{position:absolute;right:13px;top:7px;height:38px;display:flex;align-items:center;gap:10px;color:#243751;font-size:10px}.tray-time{display:grid;text-align:right;line-height:1.25}.guide{display:flex;flex-direction:column;justify-content:center;padding:8px}.guide h2{margin:0 0 20px;font-size:21px}.tip{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:13px;margin:11px 0}.tip b{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#edf2ff;color:#315fdd;font-size:14px}.tip strong{font-size:16px}footer{margin-top:30px;padding-top:21px;display:flex;align-items:center;justify-content:flex-end;gap:11px;border-top:1px solid #edf0f4}footer a,footer button{padding:11px 18px;border:1px solid #dce2ed;border-radius:9px;background:#fff;color:#536077;cursor:pointer;font-size:14px;text-decoration:none}footer .portal{border-color:#315fdd;background:#315fdd;color:#fff;box-shadow:0 5px 14px rgba(49,95,221,.22)}@media(max-width:920px){body{padding:18px}.card{padding:25px}.content{grid-template-columns:1fr}.desktop{min-height:360px}.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.guide h2{grid-column:1/-1}.tip{grid-template-columns:34px 1fr}.tip b{width:32px;height:32px}.tip strong{font-size:13px}}@media(max-width:600px){header img{width:52px;height:52px}h1{font-size:22px}header p{font-size:12px}.ready{display:none}.desktop{min-height:320px}.menu{right:72px;width:170px}.float-logo{right:16px;width:58px;height:58px}.task-search{display:none!important}.tray{display:none}.guide{grid-template-columns:1fr}footer{justify-content:stretch}footer a,footer button{flex:1;text-align:center}}
  </style>
</head>
<body>
  <main class="card">

    <section class="content">

        <img class="float-logo" src="/welcome/icon.svg" alt="桌面悬浮图标">
        <div class="menu"><div><span>⌂</span>云见主页</div><div class="selected"><span>✦</span>经验提取</div><hr><div><span>✓</span>生产环境</div><div><span></span>测试环境</div><hr><div><span>—</span>隐藏悬浮图标</div><div><span>⏻</span>退出</div></div>
        <div class="taskbar"><div class="taskbar-center"><div class="task-app"><span class="win-logo"><i></i><i></i><i></i><i></i></span></div><div class="task-app task-search"><b>⌕</b>搜索</div><div class="task-app">📁</div><div class="task-app task-outlook">O</div><div class="task-app task-core active"><img src="/welcome/icon.svg" alt="任务栏图标"></div></div><div class="tray"><span>⌃</span><span>◔</span><span>🔊</span><span class="tray-time">15:42<br>2026/8/18</span></div></div>
      </div>
      <div class="guide"><h2>接下来使用</h2><div class="tip"><b>1</b><strong>桌面悬浮 Logo</strong></div><div class="tip"><b>2</b><strong>邮件功能菜单</strong></div><div class="tip"><b>3</b><strong>任务栏</strong></div></div>
    </section>
    <footer><a class="portal" href="https://coreinsight.rnd.huawei.com" target="_blank" rel="noopener">前往云见主页</a><button id="close">关闭页面</button></footer>
  </main>
  <script>
    document.querySelector('#close').onclick=()=>{window.open('','_self');window.close()};
  </script>
</body>
</html>
