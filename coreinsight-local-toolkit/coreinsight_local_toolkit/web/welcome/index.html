<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoreInsight Local Toolkit 已启动</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#edf2ff,#f8f9fc 55%,#eef1f8);color:#18233b;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(820px,92vw);padding:30px;border:1px solid rgba(78,101,156,.13);border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(34,51,91,.15)}header{display:flex;align-items:center;gap:15px}header img{width:52px;height:52px}h1{margin:0 0 5px;font-size:23px}header p{margin:0;color:#6d7890;font-size:13px}.ready{margin-left:auto;padding:7px 11px;border-radius:18px;background:#e8f8f0;color:#248157;font-size:11px}.content{margin-top:25px;display:grid;grid-template-columns:1.35fr 1fr;gap:25px}.desktop{position:relative;min-height:280px;overflow:hidden;border:1px solid #dfe5f1;border-radius:16px;background:linear-gradient(145deg,#dfe8fc,#f2f5fb)}.desktop:before{content:"桌面";position:absolute;top:14px;left:16px;color:#9aa5b9;font-size:10px}.float-logo{position:absolute;right:24px;top:70px;width:58px;height:58px;padding:4px;border-radius:50%;filter:drop-shadow(0 7px 12px rgba(40,68,136,.25))}.menu{position:absolute;right:75px;top:56px;width:145px;padding:7px;border:1px solid #d8deea;border-radius:10px;background:#fff;box-shadow:0 13px 35px rgba(30,43,72,.18);font-size:10px}.menu div{padding:6px 9px;border-radius:5px}.menu div:nth-child(2){color:#315fdd;background:#edf2ff}.menu hr{margin:4px;border:0;border-top:1px solid #edf0f4}.taskbar{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;background:rgba(30,43,68,.88)}.taskbar img{width:23px;height:23px}.guide{display:flex;flex-direction:column;justify-content:center}.guide h2{margin:0 0 15px;font-size:16px}.tip{display:grid;grid-template-columns:28px 1fr;gap:9px;margin:8px 0}.tip b{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#edf2ff;color:#315fdd;font-size:11px}.tip strong{display:block;font-size:12px}.tip span{display:block;margin-top:3px;color:#7d879a;font-size:10px;line-height:1.5}footer{margin-top:24px;padding-top:17px;display:flex;align-items:center;border-top:1px solid #edf0f4;color:#8791a4;font-size:11px}.progress{width:90px;height:4px;margin-right:11px;overflow:hidden;border-radius:4px;background:#e7ebf3}.progress i{display:block;width:100%;height:100%;background:#4b72dc;animation:countdown 3s linear forwards}@keyframes countdown{to{width:0}}button{margin-left:auto;padding:8px 14px;border:1px solid #dce2ed;border-radius:8px;background:#fff;color:#536077;cursor:pointer;font-size:11px}@media(max-width:680px){.card{padding:22px}.content{grid-template-columns:1fr}.desktop{min-height:235px}.ready{display:none}}
  </style>
</head>
<body>
  <main class="card">
    <header><img src="/welcome/icon.svg" alt="CoreInsight"><div><h1>CoreInsight Local Toolkit 已启动</h1><p>本地服务已就绪，可以回到云见继续使用。</p></div><span class="ready">● 运行中</span></header>
    <section class="content">
      <div class="desktop"><img class="float-logo" src="/welcome/icon.svg" alt="桌面悬浮图标"><div class="menu"><div>云见主页</div><div>经验提取</div><hr><div>✓ 生产环境</div><div>测试环境</div><hr><div>隐藏悬浮图标</div><div>退出</div></div><div class="taskbar"><img src="/welcome/icon.svg" alt="任务栏图标"></div></div>
      <div class="guide"><h2>接下来怎么使用</h2><div class="tip"><b>1</b><div><strong>找到桌面悬浮 Logo</strong><span>Logo 会悬挂在桌面右侧，可以拖动到合适位置。</span></div></div><div class="tip"><b>2</b><div><strong>右键打开功能菜单</strong><span>可以进入云见、经验提取、切换环境，或隐藏和退出。</span></div></div><div class="tip"><b>3</b><div><strong>任务栏也能找回来</strong><span>隐藏 Logo 后，仍可从右下角系统托盘恢复或退出。</span></div></div></div>
    </section>
    <footer><span class="progress"><i></i></span><span id="countdown">此页面将在 3 秒后自动关闭</span><button id="close">立即关闭</button></footer>
  </main>
  <script>
    let remaining=3;const label=document.querySelector('#countdown');const closePage=()=>{window.open('','_self');window.close();setTimeout(()=>label.textContent='Toolkit 已启动，可手动关闭此页面',250)};document.querySelector('#close').onclick=closePage;const timer=setInterval(()=>{remaining-=1;if(remaining<=0){clearInterval(timer);closePage()}else label.textContent=`此页面将在 ${remaining} 秒后自动关闭`},1000);
  </script>
</body>
</html>
