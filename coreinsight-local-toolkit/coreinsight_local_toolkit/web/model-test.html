<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoreInsight AI 连通性测试</title>
<style>
body{font:14px Arial,sans-serif;max-width:760px;margin:40px auto;color:#24324a;padding:0 20px}h1{font-size:24px}button{margin:8px 8px 8px 0;padding:10px 18px;border:0;border-radius:6px;background:#356ae6;color:#fff;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;height:90px;padding:10px;border:1px solid #ccd3df;border-radius:6px}pre{white-space:pre-wrap;background:#f5f7fa;padding:14px;border-radius:6px;min-height:100px}
</style>
<h1>AI 连通性测试</h1><p>分别测试 Prompt 大模型和 CodeAgent 是否可用。测试不会写入经验中心。</p>
<textarea id="prompt">请只回复 OK，不要调用工具。</textarea><br>
<button data-resource="prompt">测试 Prompt 大模型</button><button data-resource="codeagent">测试 CodeAgent</button>
<pre id="result">等待测试…</pre>
<script>
const result=document.querySelector('#result');
document.querySelectorAll('button').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;result.textContent='测试中…';try{const r=await fetch('/model/test',{method:'POST',headers:{'Content-Type':'application/json','X-CoreInsight-Protocol':'1'},body:JSON.stringify({resource:btn.dataset.resource,prompt:document.querySelector('#prompt').value})});const d=await r.json();result.textContent=(d.ok?'成功':'失败')+' · '+d.resource+' · '+d.elapsedMs+' ms\n'+(d.result||d.error||'')}catch(e){result.textContent='请求失败：'+e.message}finally{btn.disabled=false}});
</script>
